        <a href="../index.html">
            <img src="../imagenes/logosi.jpg" alt="Logo de Tapicería Profesional">
        </a>

        <nav>
            <ul class="nav-list">
                <li><a href="../index.html">Inicio</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <section id="contacto">
            <h2>Envianos tu consulta</h2>
            <p>Completá el siguiente formulario y te responderemos a la brevedad con un presupuesto.</p>

            <form action="https://formspree.io/f/mzezgjay" method="POST">
                <div class="grupo-input">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" required>
                </div>

                <div class="grupo-input">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="grupo-input">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Contanos qué mueble te gustaría retapizar..." required></textarea>
                </div>

                <button type="submit" class="btn">Enviar consulta</button>
            </form>
        </section>
    </main>

    <footer>
        <div>
            <a href="https://www.instagram.com" target="_blank">
                <img src="../imagenes/instagram.png" alt="Instagram" width="30">
            </a>
            <a href="https://www.facebook.com" target="_blank">
